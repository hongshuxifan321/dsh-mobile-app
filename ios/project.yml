name: DSHRemote
options:
  bundleIdPrefix: com.dshmobile
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
targets:
  DSHRemote:
    type: application
    platform: iOS
    sources:
      - DSHRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dshmobile.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: DSHRemote/Info.plist
      properties:
        CFBundleDisplayName: DSH Remote
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
