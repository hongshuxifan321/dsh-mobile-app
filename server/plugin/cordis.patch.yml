# dsh-plugin-mobile-remote 配置注入：自动修复远程场景的目录选择器
# native picker（pickDirectory）被官方锁 loopback，远程一律 403；
# browse picker 用 listDirectory（不受限），应用内浏览目录，远程可用。

# 1) 禁用 auto picker（Windows+127.0.0.1 下判定为 native → 远程 403）
- id: directory-picker
  disabled: true

# 2) 挂载本插件自身（⚠️ 此 insert 行是插件 apply 的入口——删掉插件就不加载，
#    8082 代理静默消失。2026-08-15 曾因缺此行走失，见 MAINTENANCE.md 坑 28）
- insert:
    - id: mobile-remote
      name: 'dsh-plugin-mobile-remote'
      config:
        enabled: true
        proxyPort: 8082
        upstreamPort: 3080
        tunnelEnabled: false

# 3) 挂 browse：host 后端 + client 表面
- insert:
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: ui-directory-picker-browse
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'

# 4) web-runtime 补丁（trustedHosts 仅 dsh.remote 即满足运行（实测；见 MAINTENANCE.md 坑 23/29）；
#    真实隧道域名只存在 ~/.dsh/mobile-remote.auth 的 domain 行——仓库内不写真实域名；
#    start-dsh.ps1 在隧道变化时自动追加/清理运行时副本的隧道域名）
- id: web-runtime
  config:
    printUrl: true
    surfaceContext: true
    trustedHosts:
      - dsh.remote
