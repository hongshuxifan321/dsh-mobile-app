name: Build iOS

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      # 模拟器构建：无需签名，用于快速验证
      - name: Build for iOS Simulator (no signing)
        working-directory: ios
        run: |
          xcodebuild -project DSHRemote.xcodeproj \
            -scheme DSHRemote \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      - name: Upload Simulator .app artifact
        uses: actions/upload-artifact@v7
        with:
          name: dsh-remote-ios-simulator
          path: ios/build/Build/Products/Debug-iphonesimulator/DSHRemote.app

      # 真机构建（未签名）：验证 Release 配置可以编译出 iphoneos 的 .app
      # 这个 .app 不能直接安装到真机，但证明工程已具备真机构建结构。
      - name: Build unsigned Device .app
        working-directory: ios
        run: |
          xcodebuild -project DSHRemote.xcodeproj \
            -scheme DSHRemote \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build-dev \
            CODE_SIGNING_ALLOWED=NO build

      - name: Upload unsigned Device .app artifact
        uses: actions/upload-artifact@v7
        with:
          name: dsh-remote-ios-device-unsigned
          path: ios/build-dev/Build/Products/Release-iphoneos/DSHRemote.app

