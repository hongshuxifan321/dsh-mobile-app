name: Build APK

on:
  push:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      # 生成 release 签名 keystore——注意：每次构建都是新生成的一把（RUNNER_TEMP 每次
      # 全新），签名每次不同，升级需先卸载旧版（README 已注明）。如要实现"固定签名
      # 覆盖升级"，需把 keystore 持久化到仓库 Secret 而非运行时生成。
      # 密码来自仓库 Secret KEYSTORE_PASS（公开仓库也不会泄露）
      - name: Generate release keystore
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/dsh-release.keystore" \
            -alias dsh -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" \
            -dname "CN=DSH Mobile, OU=Personal, O=Personal, L=City, ST=State, C=CN"
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}

      - name: Build release APK
        run: gradle assembleRelease
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/dsh-release.keystore
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: dsh
          KEY_PASS: ${{ secrets.KEYSTORE_PASS }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: dsh-mobile-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload keystore (keep for future updates)
        uses: actions/upload-artifact@v7
        with:
          name: release-keystore
          path: ${{ runner.temp }}/dsh-release.keystore

      # 每次构建成功都自动发布到 Releases 页：用户始终可通过 Release 下载最新 APK
      - name: Publish GitHub Release
        run: |
          gh release create "v$(date +%Y%m%d-%H%M%S)" \
            app/build/outputs/apk/release/app-release.apk \
            --title "DSH Remote ${{ github.run_number }}" \
            --notes "Android APK — 手机直接下载安装（需允许安装未知来源）"
        env:
          GH_TOKEN: ${{ github.token }}
